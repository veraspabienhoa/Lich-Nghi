name: Apply app V92.6.99

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-app-v92699.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore V92.6.98 app and apply requested changes
        shell: bash
        run: |
          # V92.6.98 already contains:
          # - checkbox Chọn as first employee-list column + delete selected
          # - Ngày bắt đầu làm when adding employee
          # - canonical MENU 1-20 for Desktop/Mobile
          git checkout 3332ab2e29c46823a9e7c58051db8b18b3144d9a -- app.py

          python - <<'PY'
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          if not s.startswith('# V92.6.98'):
              raise SystemExit('ERROR: expected V92.6.98 source at commit 3332ab2')

          # Giữ nguyên 2 Google Sheet CŨ theo yêu cầu hiện tại.
          s = s.replace(
              'SHEET_MAT_KHAU_ID = "1NCMm2RApdukIiqAma7OF1E_8cq9yTjeK3k7JbMfgSoU"',
              'SHEET_MAT_KHAU_ID = "1DGXy3kPyMPwtz-3CnG8i6BiQbXFDApasoXVFzSmUe24"',
              1,
          )
          s = s.replace(
              'SHEET_DU_PHONG_ID = "1udft7erC-VxpjAa97TyD6KMVlDYBxEd-hsD7Bd_zLnE"',
              'SHEET_DU_PHONG_ID = "1Kz0aw-JatptAN9G7YSwZ6rJO09urOPaD-rS-18eZSY0"',
              1,
          )

          # Nâng version.
          first, rest = s.split('\n', 1)
          first = '# V92.6.99 - Nhan vien Chon/Xoa + Ngay bat dau lam + MENU 1-20 Desktop/Mobile + bo Ghim MENU (2026-08-23)'
          s = first + '\n' + rest

          # Bỏ logic ghim MENU: Mobile tự thu gọn sau chọn, Desktop vẫn luôn mở theo V92.6.91.
          old_open = '''    # V92.6.89 - nếu user ghim MENU thì không tự thu gọn sau khi chọn chức năng.\n    if not bool(st.session_state.get("vera_sidebar_pin_v92689", False)):\n        st.session_state["_vera_collapse_sidebar_once"] = True\n'''
          new_open = '''    # V92.6.99 - bỏ Ghim MENU. Mobile tự thu gọn sau khi chọn; Desktop luôn mở.\n    st.session_state["_vera_collapse_sidebar_once"] = True\n'''
          if old_open not in s:
              raise SystemExit('ERROR: open_app_page pin block not found')
          s = s.replace(old_open, new_open, 1)

          old_sidebar = '''    <div style='font-size:18px;font-weight:800;line-height:1.15;margin:2px 0 10px 0;text-align:center;'>📌 MENU CHỨC NĂNG</div>\n    """,\n    unsafe_allow_html=True\n)\n_sidebar_pin_v92689 = st.sidebar.toggle(\n    "📌 Ghim MENU chức năng",\n    value=bool(st.session_state.get("vera_sidebar_pin_v92689", False)),\n    key="vera_sidebar_pin_v92689",\n    help="Bật: MENU không tự ẩn sau khi chọn chức năng. Tắt: MENU tiếp tục tự thu gọn như hiện tại.",\n)\nfor page_name in allowed_pages:\n    if st.sidebar.button(page_name, key=f"nav_{PAGE_SLUGS[page_name]}", use_container_width=True,\n                         type="primary" if selected_page == page_name else "secondary"):\n        open_app_page(page_name)\n'''
          new_sidebar = '''    <div style='font-size:18px;font-weight:800;line-height:1.15;margin:2px 0 10px 0;text-align:center;'>MENU CHỨC NĂNG</div>\n    """,\n    unsafe_allow_html=True\n)\n# V92.6.99 - bỏ hoàn toàn nút Ghim MENU; xóa state ghim cũ nếu phiên còn giữ.\nst.session_state.pop("vera_sidebar_pin_v92689", None)\n_MENU_DISPLAY_LABELS_V92699 = {"🧾 Log Book": "Log Book"}\nfor page_name in allowed_pages:\n    _menu_label_v92699 = _MENU_DISPLAY_LABELS_V92699.get(page_name, page_name)\n    if st.sidebar.button(_menu_label_v92699, key=f"nav_{PAGE_SLUGS[page_name]}", use_container_width=True,\n                         type="primary" if selected_page == page_name else "secondary"):\n        open_app_page(page_name)\n'''
          if old_sidebar not in s:
              raise SystemExit('ERROR: sidebar pin UI block not found')
          s = s.replace(old_sidebar, new_sidebar, 1)

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Validate requested behavior
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import ast
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          ast.parse(s)
          required = [
              '# V92.6.99',
              'delete_employee_accounts_v92696',
              '_staff_editor_source_v92696.insert(0, "Chọn", False)',
              '"🗑️ Xóa nhân viên đã chọn"',
              'new_start_work_date = st.date_input(',
              '"Ngày bắt đầu làm"',
              'CANONICAL_MENU_ORDER_V92698 = [',
              '"📅 Đăng ký nghỉ phép"',
              '"🧾 Log Book"',
              '_MENU_DISPLAY_LABELS_V92699 = {"🧾 Log Book": "Log Book"}',
              'SHEET_MAT_KHAU_ID = "1DGXy3kPyMPwtz-3CnG8i6BiQbXFDApasoXVFzSmUe24"',
              'SHEET_DU_PHONG_ID = "1Kz0aw-JatptAN9G7YSwZ6rJO09urOPaD-rS-18eZSY0"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required markers: ' + repr(missing))
          if '"📌 Ghim MENU chức năng"' in s:
              raise SystemExit('Ghim MENU button still present')
          print('V92.6.99 validation OK')
          PY
          git diff --check

      - name: Commit directly to main and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git rm .github/workflows/apply-app-v92699.yml
          git commit -m 'feat: V92.6.99 employee controls and canonical menu'
          git push origin HEAD:main
