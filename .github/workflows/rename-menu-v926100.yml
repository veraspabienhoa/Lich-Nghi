name: Rename VERA menu labels

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  rename:
    if: github.event.issue.title == 'APPLY_VERA_V92_6_100'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rename visible menu labels only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = '_MENU_DISPLAY_LABELS_V92699 = {"🧾 Log Book": "Log Book"}'
          new = '''_MENU_DISPLAY_LABELS_V92699 = {
    "📅 Đăng ký nghỉ phép": "📅 Đăn ký nghỉ",
    "📘 Hướng dẫn sử dụng": "📘 Hướng dẫn",
    "⚙️ Giao diện tùy chỉnh": "⚙️ Giao diện",
    "🔐 Phân quyền chức năng": "🔐 Phân quyền",
    "🏖️ Phép năm - Làm đẹp": "🏖️ Phép năm",
    "⏰ Quản lý ca làm việc": "⏰ Quản lý ca",
    "🏷️ Trạng thái nhân viên": "🏷️ Trạng thái NV",
    "🔐 Khóa đăng ký LNP": "🔐 Khóa đăn ký",
    "🧾 Log Book": "Log Book",
}'''
          if old not in s:
              raise SystemExit('ERROR: menu display mapping marker not found')
          s = s.replace(old, new, 1)
          first, rest = s.split('\n', 1)
          s = '# V92.6.100 - Doi ten nhan MENU hien thi Desktop/Mobile (2026-08-23)\n' + rest
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import ast
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          ast.parse(s)
          required = [
            '"📅 Đăng ký nghỉ phép": "📅 Đăn ký nghỉ"',
            '"📘 Hướng dẫn sử dụng": "📘 Hướng dẫn"',
            '"⚙️ Giao diện tùy chỉnh": "⚙️ Giao diện"',
            '"🔐 Phân quyền chức năng": "🔐 Phân quyền"',
            '"🏖️ Phép năm - Làm đẹp": "🏖️ Phép năm"',
            '"⏰ Quản lý ca làm việc": "⏰ Quản lý ca"',
            '"🏷️ Trạng thái nhân viên": "🏷️ Trạng thái NV"',
            '"🔐 Khóa đăng ký LNP": "🔐 Khóa đăn ký"',
            'SHEET_MAT_KHAU_ID = "1DGXy3kPyMPwtz-3CnG8i6BiQbXFDApasoXVFzSmUe24"',
            'SHEET_DU_PHONG_ID = "1Kz0aw-JatptAN9G7YSwZ6rJO09urOPaD-rS-18eZSY0"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing expected markers: ' + repr(missing))
          print('V92.6.100 validation OK')
          PY
          git diff --check

      - name: Commit directly to main and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git rm .github/workflows/rename-menu-v926100.yml
          git commit -m 'feat: V92.6.100 rename menu labels'
          git push origin HEAD:main
