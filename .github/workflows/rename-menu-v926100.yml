name: Rename VERA menu labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-menu-v926100.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch menu display labels only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          # Nâng version header nhưng giữ nguyên route nội bộ.
          lines = s.splitlines()
          lines[0] = '# V92.6.100 - Doi ten hien thi MENU rut gon (2026-08-23)'
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')

          old = '_MENU_DISPLAY_LABELS_V92699 = {"🧾 Log Book": "Log Book"}'
          new = '''_MENU_DISPLAY_LABELS_V926100 = {
    "📅 Đăng ký nghỉ phép": "📅 Đăn ký nghỉ",
    "📘 Hướng dẫn sử dụng": "📘 Hướng dẫn",
    "⚙️ Giao diện tùy chỉnh": "⚙️ Giao diện",
    "🔐 Phân quyền chức năng": "🔐 Phân quyền",
    "🏖️ Phép năm - Làm đẹp": "🏖️ Phép năm",
    "⏰ Quản lý ca làm việc": "⏰ Quản lý ca",
    "🏷️ Trạng thái nhân viên": "🏷️ Trạng thái NV",
    "🔐 Khóa đăng ký LNP": "🔐 Khóa đăn ký",
    "🧾 Log Book": "Log Book",
}'''
          if old not in s:
              raise SystemExit('ERROR: display-label map V92.6.99 not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '_menu_label_v92699 = _MENU_DISPLAY_LABELS_V92699.get(page_name, page_name)',
              '_menu_label_v926100 = _MENU_DISPLAY_LABELS_V926100.get(page_name, page_name)',
              1,
          )
          s = s.replace(
              'if st.sidebar.button(_menu_label_v92699, key=f"nav_{PAGE_SLUGS[page_name]}"',
              'if st.sidebar.button(_menu_label_v926100, key=f"nav_{PAGE_SLUGS[page_name]}"',
              1,
          )

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import ast
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          ast.parse(s)
          expected = [
            '"📅 Đăng ký nghỉ phép": "📅 Đăn ký nghỉ"',
            '"📘 Hướng dẫn sử dụng": "📘 Hướng dẫn"',
            '"⚙️ Giao diện tùy chỉnh": "⚙️ Giao diện"',
            '"🔐 Phân quyền chức năng": "🔐 Phân quyền"',
            '"🏖️ Phép năm - Làm đẹp": "🏖️ Phép năm"',
            '"⏰ Quản lý ca làm việc": "⏰ Quản lý ca"',
            '"🏷️ Trạng thái nhân viên": "🏷️ Trạng thái NV"',
            '"🔐 Khóa đăng ký LNP": "🔐 Khóa đăn ký"',
          ]
          miss = [x for x in expected if x not in s]
          if miss:
              raise SystemExit('Missing labels: ' + repr(miss))
          print('MENU rename validation OK')
          PY
          git diff --check

      - name: Commit to main and clean workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git rm .github/workflows/rename-menu-v926100.yml
          git commit -m 'feat: V92.6.100 shorten menu labels'
          git push origin HEAD:main
