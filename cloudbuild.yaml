steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest"

  # Web app Vera Spa.
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=${_RUN_SERVICE_ACCOUNT}"
      - "--allow-unauthenticated"
      - "--cpu=2"
      - "--memory=4Gi"
      - "--min=1"
      - "--max=5"
      - "--concurrency=8"
      - "--timeout=3600"
      - "--cpu-boost"
      - "--set-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}"
      - "--set-env-vars=VERA_DB_ENABLED=1,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME},DB_POOL_SIZE=8,DB_MAX_OVERFLOW=12,DB_POOL_TIMEOUT=20,DB_POOL_RECYCLE=1200,DB_CONNECT_TIMEOUT=10,SMTP_SENDER_EMAIL=veraspabienhoa@gmail.com,TIMESOFT_BASE_URL=https://vera.timesoft.vn"
      - "--set-secrets=DB_PASS=vera-db-password:latest,SMTP_APP_PASSWORD=vera-smtp-app-password:latest,TIMESOFT_USERNAME=vera-timesoft-username:latest,TIMESOFT_PASSWORD=vera-timesoft-password:latest"

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "services"
      - "update"
      - "${_SERVICE}"
      - "--region=${_REGION}"
      - "--session-affinity"

  # V82: Cloud Run Job dùng cùng image, nhưng chạy script nền một lần rồi thoát.
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "${_TIMESOFT_JOB}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--service-account=${_RUN_SERVICE_ACCOUNT}"
      - "--cpu=1"
      - "--memory=2Gi"
      - "--task-timeout=900s"
      - "--max-retries=1"
      - "--tasks=1"
      - "--parallelism=1"
      - "--command=python"
      - "--args=timesoft_sync_job.py"
      - "--add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}"
      - "--set-env-vars=VERA_DB_ENABLED=1,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME},DB_POOL_SIZE=2,DB_MAX_OVERFLOW=2,DB_POOL_TIMEOUT=20,DB_POOL_RECYCLE=1200,DB_CONNECT_TIMEOUT=10,TIMESOFT_BASE_URL=https://vera.timesoft.vn,TIMESOFT_SYNC_DAYS=2,TIMESOFT_CHECKIN_PAGE_SIZE=100"
      - "--set-secrets=DB_PASS=vera-db-password:latest,TIMESOFT_USERNAME=vera-timesoft-username:latest,TIMESOFT_PASSWORD=vera-timesoft-password:latest"

substitutions:
  _REGION: "asia-southeast1"
  _AR_REPO: "vera-spa"
  _SERVICE: "vera-spa"
  _TIMESOFT_JOB: "vera-spa-timesoft-sync"
  _RUN_SERVICE_ACCOUNT: "vera-spa-run@vera-hr-app.iam.gserviceaccount.com"
  _INSTANCE_CONNECTION_NAME: "vera-hr-app:asia-southeast1:vera-spa-postgres"
  _DB_NAME: "vera_spa"
  _DB_USER: "vera_app"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest"
